services:
  rclonebrowserng:
    image: rclonebrowserng:local
    build: .
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    environment:
      RUST_LOG: "${RUST_LOG:-rclone_browser_ng=info}"
    volumes:
      - "${CONFIG_DIR:-./config}:/config"
      - "${MEDIA_DIR:-./media}:/media"
    stop_grace_period: 15s
